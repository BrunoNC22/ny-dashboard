# Local stack. For now only the database (api and web are added in #52).
#   docker compose up -d db
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ny}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ny}
      POSTGRES_DB: ${POSTGRES_DB:-ny_dashboard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql (not .../data).
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
