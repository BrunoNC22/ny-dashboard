# Web server (CLAUDE.md §11). Rendered by the nginx image from
# /etc/nginx/templates/default.conf.template: ${API_UPSTREAM} comes from the environment.

server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;

  # Same origin for the SPA and the API (no CORS, cookie with SameSite=Lax).
  location /api/ {
    proxy_pass http://${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The 1M-point sample queries take a few seconds and send tens of MB.
    proxy_read_timeout 120s;
    proxy_buffering on;
    client_max_body_size 1m;
  }

  # ES module workers (MapLibre's worker is emitted as .mjs): nginx's mime.types has no .mjs,
  # and browsers refuse module scripts served as application/octet-stream.
  location ~* ^/assets/.+\.mjs$ {
    types {}
    default_type application/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Hashed build assets: cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA: every other path serves index.html, never cached (it points to the hashed assets).
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    try_files $uri /index.html;
  }

  # The API already compresses its JSON (Content-Encoding is kept as is); this covers the
  # static files and uncompressed upstream responses.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/css application/javascript text/javascript application/json
    application/geo+json image/svg+xml text/plain;
}
